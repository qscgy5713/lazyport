[package]
name = "lazyport-desktop"
version = "0.1.0"
edition = "2021"
description = "lazyport 桌面版(Tauri + Svelte)"

[lib]
name = "lazyport_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazyport = { path = "../.." }
