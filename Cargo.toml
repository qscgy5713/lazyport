[package]
name = "lazyport"
version = "0.1.0"
edition = "2021"
description = "查看本機 port 佔用並可一鍵結束進程的小工具(macOS)"

[lib]
name = "lazyport"
path = "src/lib.rs"

[[bin]]
name = "lazyport"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
